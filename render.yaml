# Render blueprint (not deployed yet). $0/month setup: one FREE Docker web service, no disk.
# Free mode stores data in an external Neon Free PostgreSQL database (DATABASE_URL).
# There is NO persistent disk here: Render's free filesystem is ephemeral, so SQLite must not be
# used on this service. Free services spin down after ~15 min idle and take about a minute to wake.
services:
  - type: web
    name: peernest-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # paste the Neon connection string in the Render dashboard; never commit it
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # set to your Vercel frontend URL in the Render dashboard
